<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;

        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        .destaque {
            background-color: gray;
            color: white;
        }

        .resultado {
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" class="destaque" scope="col">Área</th>
                <th rowspan="2" class="destaque" scope="col">Disciplinas</th>
                <th colspan="2" class="destaque" scope="colgroup">Notas</th>
                <th rowspan="2" class="destaque" scope="col">Média</th>
            </tr>
            <tr>
                <th class="destaque" scope="col">Nota 1</th>
                <th class="destaque" scope="col">Nota 2</th>
            </tr>
            <tbody>
                <tr>
                    <th rowspan="4" scope="rowgroup">Exatas</th>
                    <td>Matemática</td>
                    <td class="resultado">0.0</td>
                    <td class="resultado">0.0</td>
                    <td class="resultado">0.0</td>
                </tr>
                <tr>
                    <td>Física</td>
                    <td class="resultado">0.0</td>
                    <td class="resultado">0.0</td>
                    <td class="resultado">0.0</td>
                </tr>
                <tr>
                    <td>Química</td>
                    <td class="resultado">0.0</td>
                    <td class="resultado">0.0</td>
                    <td class="resultado">0.0</td>
                </tr>
                <tr>
                    <td>Biologia</td>
                    <td class="resultado">0.0</td>
                    <td class="resultado">0.0</td>
                    <td class="resultado">0.0</td>
                </tr>
                <tr>
                    <th colspan="4" class="destaque" scope="row" style="text-align: left;">Média de Exatas</th>
                    <td class="resultado destaque" >0.0</td>
                </tr>
                <tr>
                    <th rowspan="2" scope="rowgroup">Humanas</th>
                    <td>História</td>
                    <td class="resultado">0.0</td>
                    <td class="resultado">0.0</td>
                    <td class="resultado">0.0</td>
                </tr>
                <tr>
                    <td>Geografia</td>
                    <td class="resultado">0.0</td>
                    <td class="resultado">0.0</td>
                    <td class="resultado">0.0</td>
                </tr>
                <tr>
                    <th colspan="4" class="destaque" scope="row" style="text-align: left;">Média de Humanas</th>
                    <td class="resultado destaque" >0.0</td>
                </tr>
            </tbody>
    </table>
</body>
</html>
